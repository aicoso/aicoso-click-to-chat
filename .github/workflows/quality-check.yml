name: Code Quality & Translation Files

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  phpcs-check:
    name: PHP Coding Standards Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Install Composer dependencies
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --with-all-dependencies \
            dealerdirect/phpcodesniffer-composer-installer:^1.0 \
            wp-coding-standards/wpcs \
            phpcompatibility/phpcompatibility-wp \
            woocommerce/woocommerce-sniffs

      - name: Add Composer global bin to PATH
        run: echo "$(composer global config bin-dir --absolute)" >> $GITHUB_PATH

      - name: Verify PHPCS configuration
        run: |
          phpcs --config-show installed_paths
          phpcs -i

      - name: Run PHPCS with clean organized output
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📋 PHPCS REPORT - WordPress & WooCommerce Coding Standards Check"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # Run PHPCS and capture output
          phpcs --standard=./phpcs.xml \
            --warning-severity=0 \
            --extensions=php \
            --ignore=vendor/*,node_modules/*,build/*,.git/*,.github/* \
            . > phpcs-output.txt 2>&1 || true

          # Check if there are errors
          if [ -s phpcs-output.txt ]; then
            # Display the organized output
            cat phpcs-output.txt

            # Check if actual errors exist
            if grep -q "ERROR" phpcs-output.txt; then
              echo ""
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "❌ PHPCS found coding standard violations. Please fix the errors above."
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              exit 1
            fi
          else
            echo "✅ No coding standard violations found!"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          fi

      - name: Generate error summary
        if: failure()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 SUMMARY - Errors by file"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          phpcs --standard=./phpcs.xml \
            --warning-severity=0 \
            --extensions=php \
            --ignore=vendor/*,node_modules/*,build/*,.git/*,.github/* \
            --report=summary \
            . || true
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  generate-pot:
    name: Generate Translation Files
    runs-on: ubuntu-latest
    needs: phpcs-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup PHP with WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: wp-cli

      - name: Install WP-CLI i18n package
        run: wp package install wp-cli/i18n-command

      - name: Prepare languages directory
        run: |
          mkdir -p languages
          # Backup existing POT if exists
          if [ -f "languages/click-to-chat.pot" ]; then
            cp languages/click-to-chat.pot languages/click-to-chat.pot.bak
          fi

      - name: Generate POT file
        run: |
          wp i18n make-pot . languages/click-to-chat.pot \
            --slug=click-to-chat \
            --domain=click-to-chat \
            --exclude=vendor,node_modules,build,tests,.git,.github \
            --headers='{"Report-Msgid-Bugs-To":"https://github.com/YOUR_USERNAME/click-to-chat/issues","Language":"en_US"}'

      - name: Verify POT file and check changes
        id: pot-check
        run: |
          if [ -f "languages/click-to-chat.pot" ]; then
            echo "✅ POT file generated successfully"

            # Check for changes
            if [ -f "languages/click-to-chat.pot.bak" ]; then
              if diff -q languages/click-to-chat.pot languages/click-to-chat.pot.bak > /dev/null; then
                echo "No changes in POT file"
                rm languages/click-to-chat.pot.bak
                echo "changed=false" >> $GITHUB_OUTPUT
              else
                echo "POT file updated with new strings"
                rm languages/click-to-chat.pot.bak
                echo "changed=true" >> $GITHUB_OUTPUT
              fi
            else
              echo "New POT file created"
              echo "changed=true" >> $GITHUB_OUTPUT
            fi

            # Show statistics
            echo "📊 Translation Statistics:"
            wc -l languages/click-to-chat.pot
          else
            echo "❌ POT file generation failed"
            exit 1
          fi

      - name: Commit and push language files
        if: steps.pot-check.outputs.changed == 'true'
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add languages/click-to-chat.pot
          git commit -m "🌐 Update translation POT file [skip ci]"
          git push origin main

      - name: Summary
        if: steps.pot-check.outputs.changed == 'true'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Translation file updated and committed successfully!"
          echo "📝 File: languages/click-to-chat.pot"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
