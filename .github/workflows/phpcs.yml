name: PHPCS WordPress Coding Standards

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  phpcs:
    name: PHPCS Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          tools: composer, cs2pr

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Configure PHPCS
        run: |
          vendor/bin/phpcs -i

      - name: Run PHPCS
        run: |
          vendor/bin/phpcs --standard=./phpcs.xml --warning-severity=0 --report=checkstyle | cs2pr || true
          vendor/bin/phpcs --standard=./phpcs.xml --error-severity=1 --warning-severity=0

      - name: Confirm PHP compatibility tooling
        run: |
          vendor/bin/phpcs -i | grep -q "PHPCompatibilityWP"
          echo "PHPCompatibilityWP is installed from composer.json."
          echo "Plugin requires PHP 7.4+ as specified in readme.txt"
